version: 2.1

# =============================================================================
# Handmade Shop — CI/CD Pipeline
# =============================================================================
# Project activated via CircleCI API (following: true)
# Branches:
#   main     → PRODUCTION  (push → approve → deploy → migrate DB)
#   staging  → STAGING     (push → test → approve → deploy → migrate DB → seed)
#   other    → test only
#
# All deployments require manual approval in the CircleCI dashboard.
# Database migrations run after deploy (backward-compatible schema required).
#
# Required CircleCI Project Environment Variables:
#   VERCEL_TOKEN                     – Vercel API token
#   VERCEL_ORG_ID                    – Vercel team / personal account ID
#   VERCEL_PROJECT_ID_WEB_STAGING    – Vercel project ID for Staging Web
#   VERCEL_PROJECT_ID_API_STAGING    – Vercel project ID for Staging API
#   VERCEL_PROJECT_ID_WEB_PROD       – Vercel project ID for Production Web
#   VERCEL_PROJECT_ID_API_PROD       – Vercel project ID for Production API
#   DATABASE_URL_STAGING             – Staging Postgres connection string (pooled, for Vercel)
#   DATABASE_URL_STAGING_DIRECT      – Staging Postgres direct connection (for migrations)
#   DATABASE_URL_PROD                – Production Postgres connection string (pooled, for Vercel)
#   DATABASE_URL_PROD_DIRECT         – Production Postgres direct connection (for migrations)
#   NEXT_PUBLIC_API_URL_STAGING      – Public API URL for staging
#   NEXT_PUBLIC_API_URL_PROD         – Public API URL for production
# =============================================================================

# ---------------------------------------------------------------------------
# Orbs
# ---------------------------------------------------------------------------
orbs:
  node: circleci/node@5

# ---------------------------------------------------------------------------
# Commands
# ---------------------------------------------------------------------------
commands:
  # ----- Install system + project dependencies ------------------------------
  install:
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@9
      - restore_cache:
          keys:
            - v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v1-pnpm-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - apps/web/node_modules
            - apps/api/node_modules
            - packages/shared/node_modules
      - run:
          name: Build shared package
          command: pnpm --filter @handmade-shop/shared build
      - run:
          name: Generate Prisma Client
          command: pnpm --filter @handmade-shop/api prisma:generate

  # ----- Deploy a specific app directory to Vercel ---------------------------
  # Deploys from the monorepo root. Uses --project flag to specify the Vercel
  # project by name (Root Directory is configured in project settings).
  deploy-vercel:
    parameters:
      app-dir:
        description: "App directory to deploy (apps/web or apps/api)"
        type: string
      project-name:
        description: "Vercel project name (e.g. handmade-shop-web-staging)"
        type: string
    steps:
      - run:
          name: Deploy << parameters.app-dir >> to Vercel
          command: |
            npx vercel deploy --prod --token=$VERCEL_TOKEN --project << parameters.project-name >> --yes

# ---------------------------------------------------------------------------
# Executors
# ---------------------------------------------------------------------------
executors:
  node-executor:
    docker:
      - image: cimg/node:20.14
    working_directory: ~/project

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # ----- Test ---------------------------------------------------------------
  test:
    executor: node-executor
    steps:
      - install
      - run:
          name: Check formatting
          command: pnpm format:check
      - run:
          name: Run linting
          command: pnpm lint
      - run:
          name: Run tests
          command: pnpm test

  # ----- Build & Deploy — STAGING -------------------------------------------
  build-and-deploy-staging:
    executor: node-executor
    steps:
      - install
      - run:
          name: Build API
          command: pnpm --filter @handmade-shop/api build
      - run:
          name: Build Web
          command: |
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL_STAGING \
              pnpm --filter @handmade-shop/web build
      - deploy-vercel:
          app-dir: apps/web
          project-name: handmade-shop-web-staging
      - deploy-vercel:
          app-dir: apps/api
          project-name: handmade-shop-api-staging
      - run:
          name: Run database migrations (Staging)
          # Uses direct connection (port 5432) instead of PgBouncer (port 6543)
          # because migrations are short-lived commands, not serverless.
          command: |
            DATABASE_URL=$DATABASE_URL_STAGING_DIRECT \
              pnpm --filter @handmade-shop/api exec prisma migrate deploy
          # Migration happens after deploy so the new schema is ready for the
          # just-deployed code.
      - run:
          name: Seed database (Staging)
          command: |
            DATABASE_URL=$DATABASE_URL_STAGING_DIRECT \
              pnpm --filter @handmade-shop/api exec tsx prisma/seed.ts
          # Seeds sample data on first deploy only — the seed script itself
          # checks if users exist and skips if already seeded (idempotent).
          when: on_success

  # ----- Build & Deploy — PRODUCTION ----------------------------------------
  build-and-deploy-production:
    executor: node-executor
    steps:
      - install
      - run:
          name: Build API
          command: pnpm --filter @handmade-shop/api build
      - run:
          name: Build Web
          command: |
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL_PROD \
              pnpm --filter @handmade-shop/web build
      - deploy-vercel:
          app-dir: apps/web
          project-name: handmade-shop-web-prod
      - deploy-vercel:
          app-dir: apps/api
          project-name: handmade-shop-api-prod
      - run:
          name: Run database migrations (Production)
          # Uses the pooled URL for now; can switch to a direct URL if needed.
          command: |
            DATABASE_URL=$DATABASE_URL_PROD \
              pnpm --filter @handmade-shop/api exec prisma migrate deploy
          # Migration runs after deploy. The deployed code must be backward-
          # compatible with the old schema to allow zero-downtime rollback.

# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------
workflows:
  # ----- Test all branches except main & staging ----------------------------
  test-branches:
    when:
      not:
        or:
          - equal: [main, << pipeline.git.branch >>]
          - equal: [staging, << pipeline.git.branch >>]
    jobs:
      - test

  # ----- Deploy STAGING on push to staging branch ---------------------------
  # Manual approval required before deployment to staging.
  deploy-staging:
    when:
      equal: [staging, << pipeline.git.branch >>]
    jobs:
      - test
      - approve-staging:
          type: approval
      - build-and-deploy-staging:
          requires:
            - test
            - approve-staging

  # ----- Deploy PRODUCTION on push to main branch ---------------------------
  # Manual approval required before deployment to production.
  # An authorized user must click "Approve" in the CircleCI dashboard.
  deploy-production:
    when:
      equal: [main, << pipeline.git.branch >>]
    jobs:
      - approve-production:
          type: approval
      - build-and-deploy-production:
          requires:
            - approve-production
